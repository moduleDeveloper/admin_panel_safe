<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin-panel</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('admin:theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}
    </script>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <!-- Dark theme: inverts + hue-rotates + tints to a slate palette. -reverse restores media colours. -->
        <filter id="theme-dark" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.4936 -1.2298 -0.1238 0 0.9500  -0.3664 -0.3698 -0.1238 0 0.9650  -0.3664 -1.2298 0.7362 0 1.0100  0 0 0 1 0" />
        </filter>
        <filter id="theme-dark-reverse" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.6674 -1.6628 -0.1674 0 1.1396  -0.4953 -0.5000 -0.1674 0 1.1222  -0.4953 -1.6628 0.9953 0 1.0699  0 0 0 1 0" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/core/main.jsx"></script>
  </body>
</html>
